<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <rect width="280" height="280" rx="64" fill="#121218" />
  <svg x="44.8" y="44.8" width="190.4" height="190.4" viewBox="0 0 280 280">
    <style>
      .stage { transform-box: view-box; transform-origin: 140px 140px; animation: stage 4s cubic-bezier(.4,0,.2,1) infinite; }
      .sheet { transform-box: view-box; transform-origin: 29px 140px; animation: tilt 4s cubic-bezier(.65,0,.35,1) infinite; }
      .flap { transform-box: fill-box; transform-origin: -4px 50%; animation: fold 4s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes stage {
        0% { opacity: 0; transform: scale(.9); }
        8% { opacity: 1; transform: scale(1); }
        86% { opacity: 1; transform: scale(1); }
        96%, 100% { opacity: 0; transform: scale(.96); }
      }
      @keyframes tilt {
        0%, 12% { transform: skewY(-19.8deg); }
        38%, 100% { transform: skewY(0deg); }
      }
      @keyframes fold {
        0%, 40% { transform: scaleX(-0.85); }
        66%, 100% { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage, .sheet, .flap { animation: none; }
      }
    </style>
    <g transform="translate(29 16)" fill="#FFFFFF">
      <g class="stage">
        <g class="sheet">
          <path d="M0 14 Q0 0 13.17 4.74 L86.83 31.26 Q100 36 100 50 L100 234 Q100 248 86.83 243.26 L13.17 216.74 Q0 212 0 198 Z" />
          <g class="flap">
            <path d="M108 147.09 Q108 137 116.18 131.09 L117.82 129.91 Q126 124 135.45 127.54 L208.89 155.08 Q222 160 210.63 168.18 L119.37 233.82 Q108 242 108 228 Z" />
          </g>
        </g>
      </g>
    </g>
  </svg>
</svg>
